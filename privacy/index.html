<title>Tsamaya privacy policy (moved)</title>
<!-- This site used to carry copies of the legal pages (v0.3). They went stale:
     the current versions live on tsamayaapp.co.za, generated from the app repo's
     legal/ folder. The page now forwards there, and the canonical link tells
     search engines and AI crawlers that the main site is the real copy, so an
     old version is never quoted as current. Old app builds that link here still
     land on the right page. -->
<link rel="canonical" href="https://tsamayaapp.co.za/privacy.html">
<meta http-equiv="refresh" content="0; url=https://tsamayaapp.co.za/privacy.html">
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1a202c;background:#fafafa;line-height:1.6}main{max-width:620px;margin:0 auto;padding:64px 24px}a{color:#047857}</style>
</head>
<body>
<main>
  <p>The Tsamaya privacy policy has moved to the main site. If you are not taken there automatically, open <a href="https://tsamayaapp.co.za/privacy.html">https://tsamayaapp.co.za/privacy.html</a>.</p>
  <p>In an emergency, call the police on 10111, or 112 from a mobile.</p>
</main>
</body>
</html>
